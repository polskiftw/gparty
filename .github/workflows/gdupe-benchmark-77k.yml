name: gdupe-benchmark-77k

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/gdupe/tests/benchmark_77k.cpp"
      - "apps/gdupe/tests/benchmark_77k/**"
      - ".github/workflows/gdupe-benchmark-77k.yml"

permissions:
  contents: read

jobs:
  benchmark:
    name: Benchmark 3.009B native pHash comparisons
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Configure and build benchmark
        shell: pwsh
        run: |
          cmake -S apps/gdupe/tests/benchmark_77k -B build/gdupe-77k-benchmark -G "Visual Studio 18 2026" -A x64
          cmake --build build/gdupe-77k-benchmark --config Release
      - name: Run benchmark
        shell: pwsh
        run: |
          $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1
          "cpu=$($cpu.Name.Trim())" | Tee-Object -FilePath gdupe-77k-benchmark.log
          "logical_processors=$($cpu.NumberOfLogicalProcessors)" | Tee-Object -FilePath gdupe-77k-benchmark.log -Append
          & "$env:GITHUB_WORKSPACE\build\gdupe-77k-benchmark\Release\gdupe_77k_benchmark.exe" 2>&1 | Tee-Object -FilePath gdupe-77k-benchmark.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload result
        uses: actions/upload-artifact@v6
        with:
          name: gdupe-77k-benchmark
          path: gdupe-77k-benchmark.log
          if-no-files-found: error
          retention-days: 7
