# IMPORTANT: Increment the trailing revision every time this workflow file changes.
name: update-cf-web 7

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Get current main project files
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Verify and record deployment revision
        shell: bash
        run: |
          set -euo pipefail

          DEPLOY_SHA="$(git rev-parse HEAD)"
          grep -Fq 'SOURCE_REQUEST_HEADER = "x-gparty-source-request"' apps/web/src/viewer.js
          grep -Fq 'TAG_INDEX_KEY = "_internal/tag-index-v1.json"' apps/web/src/viewer.js
          if grep -Fq '__Host-gparty-source-csrf' apps/web/src/viewer.js; then
            echo "Refusing to deploy the obsolete CSRF-cookie source form."
            exit 1
          fi

          echo "Deploying current main commit ${DEPLOY_SHA}"
          {
            echo "### Cloudflare Worker deployment"
            echo
            echo "- Workflow revision: 7"
            echo "- Branch: main"
            echo "- Commit: \`${DEPLOY_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Build temporary Wrangler configuration
        shell: bash
        env:
          WORKER_NAME: ${{ secrets.CLOUDFLARE_WORKER_NAME }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          set -euo pipefail

          if [ -z "${WORKER_NAME:-}" ]; then
            echo "CLOUDFLARE_WORKER_NAME secret is missing."
            exit 1
          fi

          if [ -z "${R2_BUCKET_NAME:-}" ]; then
            echo "R2_BUCKET_NAME secret is missing."
            exit 1
          fi

          cat > "${RUNNER_TEMP}/wrangler.toml" <<EOF
          name = "${WORKER_NAME}"
          main = "${GITHUB_WORKSPACE}/apps/web/src/worker.js"
          compatibility_date = "2026-07-28"
          workers_dev = false
          preview_urls = false

          [[rules]]
          type = "Text"
          globs = ["**/app.js", "**/*.css"]
          fallthrough = true

          [limits]
          cpu_ms = 300_000

          [secrets]
          required = ["CONTACT_EMAIL"]

          [[r2_buckets]]
          binding = "MEDIA_BUCKET"
          bucket_name = "${R2_BUCKET_NAME}"
          EOF

      - name: Deploy existing Worker manually
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.27.0 deploy --config "${RUNNER_TEMP}/wrangler.toml"
