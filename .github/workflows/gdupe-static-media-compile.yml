name: gdupe-static-media-compile

on:
  workflow_dispatch:
  push:
    branches: [gdupe-static-media]
    paths:
      - "apps/gdupe/src/annexb_decoder.hpp"
      - "apps/gdupe/src/aosp_avc_decode.cpp"
      - "apps/gdupe/src/aosp_hevc_decode.cpp"
      - "apps/gdupe/src/mp4_decode.cpp"
      - "apps/gdupe/src/mp4_decode.hpp"
      - ".github/workflows/gdupe-static-media-compile.yml"

permissions:
  contents: read

concurrency:
  group: gdupe-static-media-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      GDUPE_LIBAVC_DIR: ${{ github.workspace }}\third_party\libavc
      GDUPE_LIBHEVC_DIR: ${{ github.workspace }}\third_party\libhevc
      MINIMP4_COMMIT: 5a212a18dba7dca09543bbc7d65619274fd2931a
    steps:
      - uses: actions/checkout@v7

      - name: Restore static libavc SDK cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.GDUPE_LIBAVC_DIR }}
          key: gdupe-libavc-msvc-mt-${{ runner.os }}-e67b0aa3b0-v1

      - name: Restore static libhevc SDK cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.GDUPE_LIBHEVC_DIR }}
          key: gdupe-libhevc-msvc-mt-${{ runner.os }}-1476a94a5e-v1

      - name: Fetch pinned minimp4 header
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/lieff/minimp4.git third_party/minimp4
          git -C third_party/minimp4 checkout $env:MINIMP4_COMMIT

      - name: Compile isolated static-media translation units
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = (& $vswhere -latest -products * -property installationPath).Trim()
          Import-Module (Join-Path $vsInstall "Common7\Tools\Microsoft.VisualStudio.DevShell.dll")
          Enter-VsDevShell -VsInstallPath $vsInstall -SkipAutomaticLocation -DevCmdArguments "-arch=x64 -host_arch=x64"
          New-Item -ItemType Directory -Force build/probe | Out-Null

          $common = @('/nologo','/std:c++latest','/EHsc','/permissive-','/utf-8','/W4','/c','/Iapps/gdupe/src')
          & cl.exe @common apps/gdupe/src/aosp_avc_decode.cpp "/I$env:GDUPE_LIBAVC_DIR\include\common" "/I$env:GDUPE_LIBAVC_DIR\include\decoder" /Fobuild/probe/aosp_avc_decode.obj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & cl.exe @common apps/gdupe/src/aosp_hevc_decode.cpp "/I$env:GDUPE_LIBHEVC_DIR\include\common" "/I$env:GDUPE_LIBHEVC_DIR\include\decoder" /Fobuild/probe/aosp_hevc_decode.obj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & cl.exe @common apps/gdupe/src/mp4_decode.cpp /Ithird_party/minimp4 /Fobuild/probe/mp4_decode.obj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload compile objects
        uses: actions/upload-artifact@v6
        with:
          name: gdupe-static-media-compile-proof
          path: build/probe/*.obj
          if-no-files-found: error
          retention-days: 7
