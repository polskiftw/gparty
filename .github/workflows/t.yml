name: t

on:
  workflow_dispatch:
  push:
    paths:
      - 't/a.zip'
      - '.github/workflows/t.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build patched IPK and Homebrew feed
        shell: bash
        run: |
          set -euo pipefail

          git clone https://github.com/dr0dr1dr2dr3/lgappupdateblocker.git /tmp/a
          git -C /tmp/a checkout 9e48b292ce8fc7e776feb85763314e66c2061d02

          rm -rf /tmp/p
          mkdir -p /tmp/p
          unzip -q "$GITHUB_WORKSPACE/t/a.zip" -d /tmp/p
          P=/tmp/p/lgappupdateblocker-remote-fix

          cp "$P/frontend/remote-navigation.js" /tmp/a/frontend/
          cp "$P/frontend/remote-focus.css" /tmp/a/frontend/

          python3 - <<'PY'
          from pathlib import Path
          import json

          html = Path('/tmp/a/frontend/index.html')
          text = html.read_text()
          old = '    </style>\n</head>'
          new = '    </style>\n    <link rel="stylesheet" href="remote-focus.css">\n</head>'
          if old not in text:
              raise SystemExit('index.html style insertion point not found')
          text = text.replace(old, new, 1)
          old = '    <script src="index.js"></script>'
          new = old + '\n    <script src="remote-navigation.js"></script>'
          if old not in text:
              raise SystemExit('index.html script insertion point not found')
          html.write_text(text.replace(old, new, 1))

          webpack = Path('/tmp/a/webpack.config.js')
          text = webpack.read_text()
          old = "          { context: 'frontend', from: 'index.html' },"
          new = "          { context: 'frontend', from: '*.html' },\n          { context: 'frontend', from: '*.css' },\n          { context: 'frontend', from: 'remote-navigation.js' },"
          if old not in text:
              raise SystemExit('webpack frontend copy rule not found')
          webpack.write_text(text.replace(old, new, 1))

          package = Path('/tmp/a/package.json')
          data = json.loads(package.read_text())
          data['version'] = '1.0.1'
          package.write_text(json.dumps(data, indent=2) + '\n')
          PY

          cd /tmp/a
          npm install
          npm run build
          npm run package

          IPK=$(find . -maxdepth 1 -type f -name '*.ipk' -print -quit)
          test -n "$IPK"
          cp "$IPK" "$GITHUB_WORKSPACE/t/a.ipk"

          cd "$GITHUB_WORKSPACE"
          HASH=$(sha256sum t/a.ipk | awk '{print $1}')
          SIZE=$(stat -c%s t/a.ipk)

          python3 - "$HASH" "$SIZE" <<'PY'
          import json
          import sys
          from pathlib import Path

          sha256, size = sys.argv[1], int(sys.argv[2])
          base = 'https://raw.githubusercontent.com/polskiftw/gparty/main/t/'
          manifest = {
              'id': 'org.webosbrew.appupdateblocker',
              'version': '1.0.1',
              'type': 'web',
              'title': 'LG App Update Blocker',
              'appDescription': 'LG App Update Blocker with remote navigation fix',
              'iconUri': 'https://raw.githubusercontent.com/dr0dr1dr2dr3/lgappupdateblocker/master/assets/icon.png',
              'sourceUrl': 'https://github.com/dr0dr1dr2dr3/lgappupdateblocker',
              'rootRequired': True,
              'ipkUrl': base + 'a.ipk',
              'ipkHash': {'sha256': sha256},
              'ipkSize': size,
          }
          repo = {
              'paging': {
                  'page': 1,
                  'count': 1,
                  'maxPage': 1,
                  'itemsTotal': 1,
                  'prevUrl': None,
                  'nextUrl': None,
              },
              'packages': [{
                  'id': manifest['id'],
                  'title': manifest['title'],
                  'iconUri': manifest['iconUri'],
                  'manifestUrl': base + 'm',
                  'manifest': manifest,
                  'pool': 'main',
                  'requirements': {'webosRelease': '>=5.0'},
                  'shortDescription': manifest['appDescription'],
              }],
          }
          Path('t/m').write_text(json.dumps(manifest, separators=(',', ':')) + '\n')
          Path('t/r').write_text(json.dumps(repo, separators=(',', ':')) + '\n')
          PY

      - name: Publish short-path Homebrew repo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add t/a.ipk t/m t/r
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Build temporary LG Homebrew package repo'
          git push
