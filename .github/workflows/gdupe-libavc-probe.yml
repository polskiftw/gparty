name: gdupe-libavc-probe

on:
  workflow_dispatch:
  push:
    branches: [gdupe-libavc-probe]
    paths:
      - ".github/workflows/gdupe-libavc-probe.yml"
      - "apps/gdupe/experiments/libavc/**"

permissions:
  contents: read

concurrency:
  group: gdupe-libavc-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-msvc:
    name: Probe AOSP libavc decoder on Windows MSVC /MT
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      LIBAVC_COMMIT: e67b0aa3b0f5eb15b40c4d148c5d070d8a2c6828
    steps:
      - uses: actions/checkout@v7

      - name: Clone pinned AOSP libavc
        shell: pwsh
        run: |
          git clone --filter=blob:none https://android.googlesource.com/platform/external/libavc third_party/libavc
          git -C third_party/libavc checkout $env:LIBAVC_COMMIT
          git -C third_party/libavc rev-parse HEAD

      - name: Apply Windows MSVC compatibility layer
        shell: pwsh
        run: |
          $files = @(Get-ChildItem third_party/libavc -Recurse -File -Include CMakeLists.txt,*.cmake)
          $hits = @($files | Select-String -SimpleMatch '-Wdeclaration-after-statement')
          if ($hits.Count -eq 0) { throw "Expected upstream warning flag was not found" }
          foreach ($file in ($hits.Path | Sort-Object -Unique)) {
            $text = Get-Content $file -Raw
            $text = $text.Replace('-Wdeclaration-after-statement', '')
            Set-Content -Path $file -Value $text -Encoding utf8
          }

          Copy-Item apps/gdupe/experiments/libavc/ithread_windows.c `
            third_party/libavc/common/ithread.c -Force
          Copy-Item apps/gdupe/experiments/libavc/ih264_platform_macros_msvc.h `
            third_party/libavc/common/x86/ih264_platform_macros.h -Force

      - name: Configure upstream CMake with static MSVC runtime
        shell: pwsh
        run: |
          $compat = (Resolve-Path apps/gdupe/experiments/libavc/compat).Path
          cmake -S third_party/libavc -B build/libavc -G "Visual Studio 18 2026" -A x64 `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW `
            "-DCMAKE_C_FLAGS=/I$compat"

      - name: Build static decoder library
        shell: pwsh
        run: cmake --build build/libavc --config Release --target libavcdec --parallel

      - name: Verify static-only output and /MT directives
        shell: pwsh
        run: |
          $lib = Get-Item build/libavc/Release/libavcdec.lib
          $dlls = @(Get-ChildItem build/libavc -Recurse -File -Filter *.dll)
          if ($dlls.Count -ne 0) { throw "Unexpected DLL output from libavc build" }

          $dumpbin = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio\18\Enterprise\VC\Tools\MSVC" -Recurse -File -Filter dumpbin.exe |
            Where-Object { $_.FullName -match 'Hostx64\\x64\\dumpbin\.exe$' } |
            Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin.exe not found" }

          $directives = (& $dumpbin.FullName /directives $lib.FullName 2>&1 | Out-String)
          $directives | Set-Content -Encoding utf8 libavc-directives.txt
          if ($directives -notmatch '(?i)LIBCMT') { throw "Static CRT LIBCMT directive not found" }
          if ($directives -match '(?i)MSVCRT') { throw "Dynamic CRT MSVCRT directive found" }
          Write-Host "libavcdec.lib is static and requests LIBCMT (/MT)."

      - name: Build upstream decoder test executable
        shell: pwsh
        run: cmake --build build/libavc --config Release --target avcdec --parallel

      - name: Verify decoder executable has no VC runtime DLL dependency
        shell: pwsh
        run: |
          $exe = Get-Item build/libavc/Release/avcdec.exe
          $dumpbin = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio\18\Enterprise\VC\Tools\MSVC" -Recurse -File -Filter dumpbin.exe |
            Where-Object { $_.FullName -match 'Hostx64\\x64\\dumpbin\.exe$' } |
            Select-Object -First 1
          $deps = (& $dumpbin.FullName /dependents $exe.FullName 2>&1 | Out-String)
          $deps | Set-Content -Encoding utf8 avcdec-dependents.txt
          if ($deps -match '(?i)(vcruntime|msvcp|msvcr|ucrtbase)\.dll') { throw "Dynamic VC/Universal CRT dependency found" }
          Write-Host $deps

      - name: Download real H264 conformance bitstream
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://fate-suite.ffmpeg.org/h264-conformance/BA1_Sony_D.jsv" -OutFile h264-probe.264
          $sample = Get-Item h264-probe.264
          if ($sample.Length -lt 1000) { throw "Downloaded H264 sample looks invalid" }
          Write-Host "H264 sample bytes: $($sample.Length)"

      - name: Decode one real H264 frame
        shell: pwsh
        run: |
          $exe = (Resolve-Path build/libavc/Release/avcdec.exe).Path
          $input = (Resolve-Path h264-probe.264).Path
          $output = Join-Path $env:GITHUB_WORKSPACE "h264-probe.yuv"
          & $exe --input $input --output $output --save_output 1 --num_frames 1 --num_cores 1 --chroma_format YUV_420P --arch X86_SSE42
          if ($LASTEXITCODE -ne 0) { throw "avcdec failed with exit code $LASTEXITCODE" }
          $decoded = Get-Item $output -ErrorAction Stop
          if ($decoded.Length -le 0) { throw "Decoder produced empty output" }
          Write-Host "Decoded frame bytes: $($decoded.Length)"

      - name: Write proof summary
        shell: pwsh
        run: |
          @"
          AOSP libavc Windows/MSVC probe PASSED.
          source_commit=$env:LIBAVC_COMMIT
          compiler=MSVC x64 (Visual Studio 18 2026)
          runtime=/MT (LIBCMT)
          decoder_library=libavcdec.lib
          decoder_dlls=0
          avcdec_dynamic_vc_runtime=0
          real_h264_decode=passed
          "@ | Set-Content -Encoding ascii libavc-windows-proof.txt

      - name: Upload proof artifacts
        uses: actions/upload-artifact@v6
        with:
          name: gdupe-libavc-windows-proof
          path: |
            libavc-windows-proof.txt
            libavc-directives.txt
            avcdec-dependents.txt
            h264-probe.yuv
          if-no-files-found: error
          retention-days: 7
