name: gdupe-gif-probe

on:
  workflow_dispatch:
  push:
    branches: [gdupe-gif-probe]
    paths:
      - "apps/gdupe/src/gif_decode.*"
      - "apps/gdupe/experiments/gif_probe/**"
      - "apps/gdupe/experiments/gif_probe_main.cpp"
      - ".github/workflows/gdupe-gif-probe.yml"

permissions:
  contents: read

concurrency:
  group: gdupe-gif-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Configure static FLTK GIF probe
        shell: pwsh
        run: |
          cmake -S apps/gdupe/experiments/gif_probe -B build/gif-probe `
            -G "Visual Studio 18 2026" -A x64
      - name: Build probe
        run: cmake --build build/gif-probe --config Release --target gif_probe --parallel
      - name: Run real GIF decode smoke test
        run: build\gif-probe\Release\gif_probe.exe
