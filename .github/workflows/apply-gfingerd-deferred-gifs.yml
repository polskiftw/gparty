name: Apply gfingerd deferred GIF policy

on:
  push:
    branches:
      - agent/background-fingerprinter
    paths:
      - .github/workflows/apply-gfingerd-deferred-gifs.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/background-fingerprinter
          fetch-depth: 0
      - name: Apply deferred GIF patch
        run: python tools/apply_gfingerd_deferred_gifs.py
      - name: Remove one-shot patch machinery
        run: |
          rm tools/apply_gfingerd_deferred_gifs.py
          rm .github/workflows/apply-gfingerd-deferred-gifs.yml
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Defer malformed GIFs for later recovery"
          git push origin HEAD:agent/background-fingerprinter
