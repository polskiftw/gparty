name: deploy-private-file-site 1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gooning-party-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify safety prerequisites
        shell: bash
        env:
          ENABLED: ${{ vars.GPARTY_PRIVATE_DROPBOX_ENABLED }}
          WORKER_NAME: ${{ secrets.CLOUDFLARE_WORKER_NAME }}
          FILE_BUCKET: ${{ secrets.PRIVATE_FILES_R2_BUCKET }}
          AI_REPO: ${{ secrets.AI_GITHUB_REPO }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${ENABLED:-}" != "true" ]; then
            echo "Private mode must be explicitly enabled; refusing deployment."
            exit 1
          fi
          if [[ ! "${WORKER_NAME:-}" =~ ^[A-Za-z0-9_-]+$ ]] || [ -z "${ACCOUNT:-}" ] || [ -z "${TOKEN:-}" ]; then
            echo "Cloudflare Worker name/account/token is missing or malformed."
            exit 1
          fi
          if [[ ! "${FILE_BUCKET:-}" =~ ^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$ ]]; then
            echo "Private R2 bucket secret missing or invalid."
            exit 1
          fi
          if [[ ! "${AI_REPO:-}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "AI_GITHUB_REPO must be an existing separate private repository."
            exit 1
          fi
          if grep -q 'MEDIA_BUCKET' apps/web/src/worker.js; then
            echo "Old gallery Worker code detected. Refusing to deploy."
            exit 1
          fi
          echo "Deploying mTLS-only private file site from $(git rev-parse HEAD)"

      - name: Build and deploy private Cloudflare Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: ${{ secrets.CLOUDFLARE_WORKER_NAME }}
          FILE_BUCKET: ${{ secrets.PRIVATE_FILES_R2_BUCKET }}
          AI_REPO: ${{ secrets.AI_GITHUB_REPO }}
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/wrangler.toml" <<EOF
          name = "${WORKER_NAME}"
          main = "${GITHUB_WORKSPACE}/apps/web/src/worker.js"
          compatibility_date = "2026-07-28"
          workers_dev = false
          preview_urls = false

          [[rules]]
          type = "Text"
          globs = ["**/app.js", "**/chaos.js", "**/*.css", "**/*.svg"]
          fallthrough = true

          [[rules]]
          type = "Data"
          globs = ["**/*.mid"]
          fallthrough = true

          [limits]
          cpu_ms = 300_000

          [[durable_objects.bindings]]
          name = "VISITOR_COUNTER"
          class_name = "VisitorCounter"

          [[migrations]]
          tag = "gparty-visitor-counter-v1"
          new_sqlite_classes = ["VisitorCounter"]

          [secrets]
          required = ["AI_GITHUB_TOKEN"]

          [[r2_buckets]]
          binding = "PRIVATE_FILES_BUCKET"
          bucket_name = "${FILE_BUCKET}"

          [vars]
          AI_GITHUB_REPO = "${AI_REPO}"
          EOF
          npx --yes wrangler@4.27.0 deploy --config "${RUNNER_TEMP}/wrangler.toml"
