name: R2 to B2 Random 2 GB Throughput Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gparty-r2-b2-transfer-test
  cancel-in-progress: false

jobs:
  transfer-test:
    name: Copy and verify ~2 GB of random assets
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      B2_BUCKET_NAME: gooning-party-media-b2
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}

    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check "boto3==1.40.1" "requests==2.32.5"

      - name: Validate required settings
        shell: bash
        run: |
          set -euo pipefail
          for name in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME B2_KEY_ID B2_APPLICATION_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "Required secret ${name} is missing."
              exit 1
            fi
          done
          echo "All required settings are present."

      - name: Copy, verify, benchmark, and clean up random R2 assets
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import random
          import tempfile
          import time
          import urllib.parse
          from pathlib import Path

          import boto3
          import requests
          from botocore.config import Config

          TARGET_BYTES = 2_000_000_000
          SOURCE_PREFIX = "gallery/"
          TEST_PREFIX = f"__gparty_migration_test__/run-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}/"
          REPORT_PATH = Path("r2-to-b2-transfer-test-report.json")
          MAX_B2_ATTEMPTS = 6
          RETRYABLE_STATUS = {408, 409, 429, 500, 502, 503, 504}

          def fail_response(response, operation):
              if response.ok:
                  return
              try:
                  detail = response.json()
              except Exception:
                  detail = response.text[:1000]
              raise RuntimeError(f"{operation} failed with HTTP {response.status_code}: {detail}")

          def retry_delay(attempt):
              # 2, 4, 8, 16, 32 seconds, plus small jitter.
              return min(32, 2 ** attempt) + random.random()

          def rate_mbps(byte_count, seconds):
              return 0.0 if seconds <= 0 else (byte_count / 1_000_000) / seconds

          r2 = boto3.client(
              "s3",
              endpoint_url=f"https://{os.environ['R2_ACCOUNT_ID']}.r2.cloudflarestorage.com",
              aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
              region_name="auto",
              config=Config(
                  signature_version="s3v4",
                  retries={"max_attempts": 10, "mode": "standard"},
              ),
          )

          eligible = []
          paginator = r2.get_paginator("list_objects_v2")
          for page in paginator.paginate(
              Bucket=os.environ["R2_BUCKET_NAME"],
              Prefix=SOURCE_PREFIX,
              PaginationConfig={"PageSize": 1000},
          ):
              for item in page.get("Contents", []):
                  size = int(item["Size"])
                  if size > 0:
                      eligible.append({"key": item["Key"], "size": size})

          random.SystemRandom().shuffle(eligible)
          sample = []
          selected_bytes = 0
          for item in eligible:
              sample.append(item)
              selected_bytes += item["size"]
              if selected_bytes >= TARGET_BYTES:
                  break

          if selected_bytes < TARGET_BYTES:
              raise RuntimeError(
                  f"Eligible gallery data totals only {selected_bytes:,} bytes; cannot build a 2 GB sample."
              )

          print(
              f"Selected {len(sample):,} random assets from {len(eligible):,} eligible R2 objects, "
              f"totaling {selected_bytes:,} bytes ({selected_bytes / 1_000_000_000:.3f} GB)."
          )

          basic = base64.b64encode(
              f"{os.environ['B2_KEY_ID']}:{os.environ['B2_APPLICATION_KEY']}".encode("utf-8")
          ).decode("ascii")
          auth_response = requests.get(
              "https://api.backblazeb2.com/b2api/v2/b2_authorize_account",
              headers={"Authorization": f"Basic {basic}"},
              timeout=60,
          )
          fail_response(auth_response, "B2 authorization")
          auth = auth_response.json()
          token = auth["authorizationToken"]
          api_url = auth["apiUrl"]
          download_url = auth["downloadUrl"]
          allowed = auth.get("allowed", {})

          expected_bucket = os.environ["B2_BUCKET_NAME"]
          if allowed.get("bucketName") != expected_bucket or not allowed.get("bucketId"):
              raise RuntimeError(f"B2 key is not restricted to expected bucket {expected_bucket!r}.")

          required = {"listFiles", "readFiles", "writeFiles", "deleteFiles"}
          missing = sorted(required - set(allowed.get("capabilities", [])))
          if missing:
              raise RuntimeError(f"B2 key lacks required capabilities: {', '.join(missing)}")

          bucket_id = allowed["bucketId"]
          results = []
          cleanup_failures = []
          retry_events = []
          primary_error = None
          total_r2_seconds = 0.0
          total_b2_upload_seconds = 0.0
          total_b2_verify_seconds = 0.0
          overall_start = time.perf_counter()

          def get_upload_details(source_key):
              last_error = None
              for attempt in range(1, MAX_B2_ATTEMPTS + 1):
                  try:
                      response = requests.post(
                          f"{api_url}/b2api/v2/b2_get_upload_url",
                          headers={"Authorization": token},
                          json={"bucketId": bucket_id},
                          timeout=60,
                      )
                      if response.ok:
                          return response.json()
                      if response.status_code not in RETRYABLE_STATUS:
                          fail_response(response, "B2 get upload URL")
                      last_error = f"HTTP {response.status_code}: {response.text[:500]}"
                  except requests.RequestException as error:
                      last_error = repr(error)
                  if attempt < MAX_B2_ATTEMPTS:
                      delay = retry_delay(attempt)
                      retry_events.append({"operation": "get_upload_url", "source_key": source_key, "attempt": attempt, "delay_seconds": delay, "error": last_error})
                      print(f"  transient B2 get-upload-url failure; retry {attempt}/{MAX_B2_ATTEMPTS - 1} in {delay:.1f}s")
                      time.sleep(delay)
              raise RuntimeError(f"B2 get upload URL exhausted retries for {source_key!r}: {last_error}")

          def upload_with_retry(source_key, destination_name, local_path, downloaded_size, source_sha1):
              last_error = None
              total_seconds = 0.0
              encoded_name = urllib.parse.quote(destination_name, safe="/")
              for attempt in range(1, MAX_B2_ATTEMPTS + 1):
                  upload_details = get_upload_details(source_key)
                  start = time.perf_counter()
                  try:
                      with local_path.open("rb") as source_file:
                          response = requests.post(
                              upload_details["uploadUrl"],
                              headers={
                                  "Authorization": upload_details["authorizationToken"],
                                  "X-Bz-File-Name": encoded_name,
                                  "Content-Type": "b2/x-auto",
                                  "Content-Length": str(downloaded_size),
                                  "X-Bz-Content-Sha1": source_sha1,
                              },
                              data=source_file,
                              timeout=(60, 1800),
                          )
                      total_seconds += time.perf_counter() - start
                      if response.ok:
                          return response.json(), total_seconds
                      if response.status_code not in RETRYABLE_STATUS:
                          fail_response(response, f"B2 upload for {source_key}")
                      last_error = f"HTTP {response.status_code}: {response.text[:500]}"
                  except requests.RequestException as error:
                      total_seconds += time.perf_counter() - start
                      last_error = repr(error)
                  if attempt < MAX_B2_ATTEMPTS:
                      delay = retry_delay(attempt)
                      retry_events.append({"operation": "upload", "source_key": source_key, "attempt": attempt, "delay_seconds": delay, "error": last_error})
                      print(f"  transient B2 upload failure; retry {attempt}/{MAX_B2_ATTEMPTS - 1} in {delay:.1f}s")
                      time.sleep(delay)
              raise RuntimeError(f"B2 upload exhausted retries for {source_key!r}: {last_error}")

          def verify_with_retry(source_key, file_id, expected_size, expected_sha256):
              last_error = None
              total_seconds = 0.0
              for attempt in range(1, MAX_B2_ATTEMPTS + 1):
                  start = time.perf_counter()
                  try:
                      response = requests.get(
                          f"{download_url}/b2api/v2/b2_download_file_by_id",
                          headers={"Authorization": token},
                          params={"fileId": file_id},
                          stream=True,
                          timeout=(60, 1800),
                      )
                      if not response.ok:
                          total_seconds += time.perf_counter() - start
                          if response.status_code not in RETRYABLE_STATUS:
                              fail_response(response, f"B2 verification download for {source_key}")
                          last_error = f"HTTP {response.status_code}: {response.text[:500]}"
                      else:
                          digest = hashlib.sha256()
                          size = 0
                          for chunk in response.iter_content(chunk_size=8 * 1024 * 1024):
                              if chunk:
                                  digest.update(chunk)
                                  size += len(chunk)
                          total_seconds += time.perf_counter() - start
                          if size != expected_size:
                              raise RuntimeError(f"B2 verification size mismatch for {source_key!r}: R2={expected_size}, B2={size}.")
                          if digest.hexdigest() != expected_sha256:
                              raise RuntimeError(f"Byte-for-byte SHA-256 mismatch for {source_key!r}.")
                          return total_seconds
                  except requests.RequestException as error:
                      total_seconds += time.perf_counter() - start
                      last_error = repr(error)
                  if attempt < MAX_B2_ATTEMPTS:
                      delay = retry_delay(attempt)
                      retry_events.append({"operation": "verify_download", "source_key": source_key, "attempt": attempt, "delay_seconds": delay, "error": last_error})
                      print(f"  transient B2 verification failure; retry {attempt}/{MAX_B2_ATTEMPTS - 1} in {delay:.1f}s")
                      time.sleep(delay)
              raise RuntimeError(f"B2 verification download exhausted retries for {source_key!r}: {last_error}")

          def delete_with_retry(source_key, destination_name, file_id):
              last_error = None
              for attempt in range(1, MAX_B2_ATTEMPTS + 1):
                  try:
                      response = requests.post(
                          f"{api_url}/b2api/v2/b2_delete_file_version",
                          headers={"Authorization": token},
                          json={"fileName": destination_name, "fileId": file_id},
                          timeout=60,
                      )
                      if response.ok:
                          return None
                      if response.status_code not in RETRYABLE_STATUS:
                          try:
                              return response.json()
                          except Exception:
                              return response.text[:1000]
                      last_error = f"HTTP {response.status_code}: {response.text[:500]}"
                  except requests.RequestException as error:
                      last_error = repr(error)
                  if attempt < MAX_B2_ATTEMPTS:
                      delay = retry_delay(attempt)
                      retry_events.append({"operation": "delete", "source_key": source_key, "attempt": attempt, "delay_seconds": delay, "error": last_error})
                      print(f"  transient B2 cleanup failure; retry {attempt}/{MAX_B2_ATTEMPTS - 1} in {delay:.1f}s")
                      time.sleep(delay)
              return last_error

          try:
              with tempfile.TemporaryDirectory(prefix="gparty-r2-b2-test-") as temp_dir_name:
                  temp_dir = Path(temp_dir_name)

                  for index, item in enumerate(sample, 1):
                      source_key = item["key"]
                      expected_size = item["size"]
                      destination_name = TEST_PREFIX + source_key
                      local_path = temp_dir / f"asset-{index:05d}.bin"

                      print(f"[{index}/{len(sample)}] {source_key} ({expected_size:,} bytes)")

                      source_sha256 = hashlib.sha256()
                      source_sha1 = hashlib.sha1()
                      downloaded_size = 0
                      r2_start = time.perf_counter()
                      source_response = r2.get_object(
                          Bucket=os.environ["R2_BUCKET_NAME"],
                          Key=source_key,
                      )
                      with local_path.open("wb") as output:
                          while True:
                              chunk = source_response["Body"].read(8 * 1024 * 1024)
                              if not chunk:
                                  break
                              output.write(chunk)
                              source_sha256.update(chunk)
                              source_sha1.update(chunk)
                              downloaded_size += len(chunk)
                      r2_seconds = time.perf_counter() - r2_start
                      total_r2_seconds += r2_seconds

                      if downloaded_size != expected_size:
                          raise RuntimeError(
                              f"R2 size mismatch for {source_key!r}: listed {expected_size}, downloaded {downloaded_size}."
                          )

                      uploaded, upload_seconds = upload_with_retry(
                          source_key,
                          destination_name,
                          local_path,
                          downloaded_size,
                          source_sha1.hexdigest(),
                      )
                      total_b2_upload_seconds += upload_seconds
                      file_id = uploaded["fileId"]

                      try:
                          if uploaded.get("fileName") != destination_name:
                              raise RuntimeError(f"B2 returned wrong filename for {source_key!r}.")
                          if int(uploaded.get("contentLength", -1)) != downloaded_size:
                              raise RuntimeError(f"B2 returned wrong size for {source_key!r}.")
                          if uploaded.get("contentSha1") != source_sha1.hexdigest():
                              raise RuntimeError(f"B2 returned wrong SHA-1 for {source_key!r}.")

                          verify_seconds = verify_with_retry(
                              source_key,
                              file_id,
                              downloaded_size,
                              source_sha256.hexdigest(),
                          )
                          total_b2_verify_seconds += verify_seconds

                          results.append(
                              {
                                  "source_key": source_key,
                                  "bytes": downloaded_size,
                                  "sha256": source_sha256.hexdigest(),
                                  "r2_download_seconds": r2_seconds,
                                  "b2_upload_seconds": upload_seconds,
                                  "b2_verify_seconds": verify_seconds,
                                  "cleanup": "pending",
                              }
                          )
                      finally:
                          cleanup_error = delete_with_retry(source_key, destination_name, file_id)
                          if cleanup_error is None:
                              if results and results[-1].get("source_key") == source_key:
                                  results[-1]["cleanup"] = "passed"
                          else:
                              cleanup_failures.append(
                                  {
                                      "source_key": source_key,
                                      "test_destination": destination_name,
                                      "file_id": file_id,
                                      "error": cleanup_error,
                                  }
                              )

                      local_path.unlink(missing_ok=True)

          except Exception as error:
              primary_error = error

          overall_seconds = time.perf_counter() - overall_start
          verified_bytes = sum(result["bytes"] for result in results)
          timings = {
              "overall_seconds": overall_seconds,
              "r2_download_seconds": total_r2_seconds,
              "b2_upload_seconds": total_b2_upload_seconds,
              "b2_verify_download_seconds": total_b2_verify_seconds,
              "r2_download_MBps": rate_mbps(verified_bytes, total_r2_seconds),
              "b2_upload_MBps": rate_mbps(verified_bytes, total_b2_upload_seconds),
              "b2_verify_download_MBps": rate_mbps(verified_bytes, total_b2_verify_seconds),
              "end_to_end_MBps": rate_mbps(verified_bytes, overall_seconds),
          }

          report = {
              "format": "gparty-r2-to-b2-throughput-test-v3",
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "target_bytes": TARGET_BYTES,
              "selected_asset_count": len(sample),
              "selected_bytes": selected_bytes,
              "eligible_r2_assets": len(eligible),
              "verified_asset_count": len(results),
              "verified_bytes": verified_bytes,
              "temporary_b2_prefix": TEST_PREFIX,
              "timings": timings,
              "retry_events": retry_events,
              "results": results,
              "cleanup_failures": cleanup_failures,
              "passed": primary_error is None and not cleanup_failures and len(results) == len(sample),
          }
          if primary_error is not None:
              report["error"] = str(primary_error)
          REPORT_PATH.write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")

          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write("## R2 → B2 random ~2 GB throughput test\n\n")
              summary.write(f"- Selected assets: **{len(sample):,}**\n")
              summary.write(f"- Selected bytes: **{selected_bytes:,}** ({selected_bytes / 1_000_000_000:.3f} GB)\n")
              summary.write(f"- Verified: **{len(results):,}/{len(sample):,} assets**\n")
              summary.write(f"- Transient retries: **{len(retry_events)}**\n")
              summary.write(f"- Cleanup failures: **{len(cleanup_failures)}**\n")
              summary.write("- R2 writes/deletes: **none**\n\n")
              summary.write("### Throughput\n\n")
              summary.write(f"- R2 download: **{timings['r2_download_MBps']:.2f} MB/s** ({total_r2_seconds:.2f} s)\n")
              summary.write(f"- B2 upload: **{timings['b2_upload_MBps']:.2f} MB/s** ({total_b2_upload_seconds:.2f} s)\n")
              summary.write(f"- B2 verification download: **{timings['b2_verify_download_MBps']:.2f} MB/s** ({total_b2_verify_seconds:.2f} s)\n")
              summary.write(f"- End-to-end: **{timings['end_to_end_MBps']:.2f} MB/s** ({overall_seconds:.2f} s)\n")

          if cleanup_failures:
              raise RuntimeError(
                  f"{len(cleanup_failures)} temporary B2 test object(s) could not be cleaned up."
              )
          if primary_error is not None:
              raise primary_error
          if len(results) != len(sample):
              raise RuntimeError(f"Only {len(results)} of {len(sample)} selected objects were verified.")

          print()
          print(
              f"PASS: {len(results):,} random assets / {verified_bytes / 1_000_000_000:.3f} GB "
              "copied to B2, verified byte-for-byte, benchmarked, and cleaned up."
          )
          print(f"Transient retries: {len(retry_events)}")
          print(f"R2 download: {timings['r2_download_MBps']:.2f} MB/s")
          print(f"B2 upload: {timings['b2_upload_MBps']:.2f} MB/s")
          print(f"B2 verify download: {timings['b2_verify_download_MBps']:.2f} MB/s")
          print(f"End-to-end: {timings['end_to_end_MBps']:.2f} MB/s")
          PY

      - name: Upload transfer test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-to-b2-throughput-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: r2-to-b2-transfer-test-report.json
          if-no-files-found: warn
          retention-days: 90

      - name: State safety boundary
        if: always()
        shell: bash
        run: |
          {
            echo ""
            echo "## Safety boundary"
            echo ""
            echo "This test never writes, overwrites, or deletes any R2 object."
            echo "B2 copies exist only under a run-specific __gparty_migration_test__/ prefix and are deleted after verification."
            echo "Transient B2 service errors are retried with backoff; permanent errors still fail the run."
            echo "This workflow does not start the full migration or change the live Worker."
          } >> "$GITHUB_STEP_SUMMARY"
