name: repair-gdupe-icon

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-gdupe-icon.yml"

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Export intact icon frames for recovery
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import struct

          data = Path('apps/gdupe/resources/gdupe.ico').read_bytes()
          reserved, kind, count = struct.unpack_from('<HHH', data, 0)
          assert reserved == 0 and kind == 1 and count >= 2
          signature = b'\x89PNG\r\n\x1a\n'

          for index in (0, 1):
              entry = 6 + index * 16
              width, height, _colors, _reserved, _planes, _bpp, size, offset = struct.unpack_from(
                  '<BBBBHHII', data, entry
              )
              width = 256 if width == 0 else width
              height = 256 if height == 0 else height
              payload = data[offset:offset + size]
              assert payload.startswith(signature), (index, payload[:8])
              print(f'FRAME_{width}x{height}_BASE64={base64.b64encode(payload).decode("ascii")}')
          PY
