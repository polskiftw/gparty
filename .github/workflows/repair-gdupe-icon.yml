name: repair-gdupe-icon

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-gdupe-icon.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Correct ICO directory metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import struct

          path = Path('apps/gdupe/resources/gdupe.ico')
          data = bytearray(path.read_bytes())
          reserved, kind, count = struct.unpack_from('<HHH', data, 0)
          assert reserved == 0 and kind == 1 and count > 0

          sizes = []
          previous_end = 6 + count * 16
          for index in range(count):
              entry = 6 + index * 16
              width, height, colors, entry_reserved, planes, bpp, size, offset = struct.unpack_from(
                  '<BBBBHHII', data, entry
              )
              width = 256 if width == 0 else width
              height = 256 if height == 0 else height
              assert colors == 0 and entry_reserved == 0
              assert bpp == 32, (index, bpp)
              assert offset >= previous_end, (index, offset, previous_end)
              assert offset + size <= len(data), (index, offset, size, len(data))
              payload = data[offset:offset + size]
              assert payload.startswith(b'\x89PNG\r\n\x1a\n'), (index, payload[:8])
              struct.pack_into('<H', data, entry + 4, 1)
              sizes.append((width, height))
              previous_end = offset + size

          assert previous_end == len(data), (previous_end, len(data))
          path.write_bytes(data)

          verified = path.read_bytes()
          for index in range(count):
              entry = 6 + index * 16
              planes = struct.unpack_from('<H', verified, entry + 4)[0]
              assert planes == 1, (index, planes)
          print(f'Corrected wPlanes metadata for {count} icon frames: {sizes}')
          PY

      - name: Commit corrected icon
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/gdupe/resources/gdupe.ico; then
            echo 'Icon metadata already corrected.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/gdupe/resources/gdupe.ico
          git commit -m 'Correct gdupe icon metadata for Windows resource compiler'
          git push origin HEAD:main
