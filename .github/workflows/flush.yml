name: Flush

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gparty-r2-index-writer
  cancel-in-progress: false

jobs:
  repair-index:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Get the project files
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install R2 client package
        run: pip install -r requirements.txt

      - name: Test shared index writes
        run: python -m unittest discover -s apps/web/tests -p "test_index_store.py" -v

      - name: Repair gallery-index.json from existing R2 media
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python apps/web/scripts/repair_index.py
