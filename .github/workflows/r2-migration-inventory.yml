name: R2 Migration Inventory

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    name: Build frozen R2 inventory
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install R2 client library
        run: |
          python -m pip install --upgrade pip
          pip install boto3

      - name: Inventory R2 bucket
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          import boto3
          from botocore.config import Config

          required = [
              "R2_ACCOUNT_ID",
              "R2_ACCESS_KEY_ID",
              "R2_SECRET_ACCESS_KEY",
              "R2_BUCKET_NAME",
          ]
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit(
                  "Missing required GitHub secret(s): " + ", ".join(missing)
              )

          account_id = os.environ["R2_ACCOUNT_ID"]
          bucket = os.environ["R2_BUCKET_NAME"]
          endpoint = f"https://{account_id}.r2.cloudflarestorage.com"

          client = boto3.client(
              "s3",
              endpoint_url=endpoint,
              aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
              region_name="auto",
              config=Config(
                  signature_version="s3v4",
                  retries={"max_attempts": 10, "mode": "standard"},
              ),
          )

          objects = []
          total_bytes = 0
          paginator = client.get_paginator("list_objects_v2")

          print(f"Reading frozen inventory from R2 bucket: {bucket}")

          for page_number, page in enumerate(
              paginator.paginate(Bucket=bucket), start=1
          ):
              for item in page.get("Contents", []):
                  size = int(item["Size"])
                  total_bytes += size
                  objects.append(
                      {
                          "key": item["Key"],
                          "size": size,
                          "etag": item.get("ETag", "").strip('"'),
                          "last_modified": item["LastModified"].astimezone(
                              timezone.utc
                          ).isoformat(),
                      }
                  )

              if page_number % 25 == 0:
                  print(
                      f"Listed {len(objects):,} objects "
                      f"({total_bytes / 1_000_000_000:.2f} GB so far)"
                  )

          # The API returns keys in order, but sort explicitly so the migration
          # manifest is deterministic and easy to compare later.
          objects.sort(key=lambda item: item["key"])

          manifest = {
              "format": "gparty-r2-migration-inventory-v1",
              "created_at_utc": datetime.now(timezone.utc).isoformat(),
              "source": "Cloudflare R2",
              "bucket": bucket,
              "object_count": len(objects),
              "total_bytes": total_bytes,
              "objects": objects,
          }

          output = Path("r2-inventory.json")
          output.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          gib = total_bytes / (1024 ** 3)
          gb = total_bytes / 1_000_000_000

          summary = (
              "# R2 Migration Inventory\n\n"
              f"- **Objects:** {len(objects):,}\n"
              f"- **Bytes:** {total_bytes:,}\n"
              f"- **Decimal GB:** {gb:.3f} GB\n"
              f"- **Binary GiB:** {gib:.3f} GiB\n"
              f"- **Manifest:** `r2-inventory.json`\n"
          )

          Path("r2-inventory-summary.md").write_text(summary, encoding="utf-8")

          github_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if github_summary:
              with open(github_summary, "a", encoding="utf-8") as handle:
                  handle.write(summary)

          print()
          print("Inventory complete.")
          print(f"Objects: {len(objects):,}")
          print(f"Bytes:   {total_bytes:,}")
          print(f"Size:    {gb:.3f} GB ({gib:.3f} GiB)")
          PY

      - name: Save frozen inventory
        uses: actions/upload-artifact@v4
        with:
          name: r2-migration-inventory
          path: |
            r2-inventory.json
            r2-inventory-summary.md
          if-no-files-found: error
          retention-days: 90
