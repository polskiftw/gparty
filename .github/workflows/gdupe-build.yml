name: gdupe-build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/gdupe/**"
      - ".github/workflows/gdupe-build.yml"
  pull_request:
    paths:
      - "apps/gdupe/**"
      - ".github/workflows/gdupe-build.yml"

permissions:
  contents: read

concurrency:
  group: gdupe-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build and validate static Windows application
    runs-on: windows-2025
    timeout-minutes: 360
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
      GDUPE_LIBAVC_DIR: ${{ github.workspace }}\third_party\libavc
      GDUPE_LIBHEVC_DIR: ${{ github.workspace }}\third_party\libhevc
    steps:
      - uses: actions/checkout@v7

      - name: Restore static libavc SDK cache
        id: libavc-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.GDUPE_LIBAVC_DIR }}
          key: gdupe-libavc-msvc-mt-${{ runner.os }}-e67b0aa3b0-v4

      - name: Restore static libhevc SDK cache
        id: libhevc-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.GDUPE_LIBHEVC_DIR }}
          key: gdupe-libhevc-msvc-mt-${{ runner.os }}-1476a94a5e-v4

      - name: Restore compiled dependency cache
        id: vcpkg-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-gdupe-static-all-${{ runner.os }}-${{ hashFiles('apps/gdupe/vcpkg.json', 'apps/gdupe/cmake/triplets/x64-windows-static-crt.cmake') }}

      - name: Install pinned vcpkg
        id: vcpkg-setup
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
          git -C $env:VCPKG_ROOT checkout 4f6d4ae8247b2dcae554555a135e52bb449dd524
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - name: Build source-pinned static AOSP libavc with MSVC
        if: steps.libavc-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: apps/gdupe/scripts/build_libavc.ps1

      - name: Preserve static libavc SDK
        if: steps.libavc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.GDUPE_LIBAVC_DIR }}
          key: gdupe-libavc-msvc-mt-${{ runner.os }}-e67b0aa3b0-v4

      - name: Build source-pinned static AOSP libhevc with MSVC
        if: steps.libhevc-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: apps/gdupe/scripts/build_libhevc.ps1

      - name: Preserve static libhevc SDK
        if: steps.libhevc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.GDUPE_LIBHEVC_DIR }}
          key: gdupe-libhevc-msvc-mt-${{ runner.os }}-1476a94a5e-v4

      - name: Configure
        shell: pwsh
        run: |
          cmake -S apps/gdupe -B build/gdupe -G "Visual Studio 18 2026" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-crt `
            -DVCPKG_OVERLAY_TRIPLETS="$env:GITHUB_WORKSPACE\apps\gdupe\cmake\triplets" `
            -DGDUPE_LIBAVC_DIR="$env:GDUPE_LIBAVC_DIR" `
            -DGDUPE_LIBHEVC_DIR="$env:GDUPE_LIBHEVC_DIR"

      - name: Audit native Windows dependency surface
        shell: pwsh
        run: apps/gdupe/scripts/audit_dependencies.ps1

      - name: Build and capture diagnostics
        id: build
        continue-on-error: true
        shell: pwsh
        run: |
          $log = Join-Path $env:GITHUB_WORKSPACE "gdupe-msvc-build.log"
          cmake --build build/gdupe --config Release 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          "exit_code=$code" | Set-Content -Encoding ascii gdupe-build-status.txt
          if ($code -ne 0) { exit $code }

      - name: Diagnose Release CRT provenance
        if: steps.build.outcome == 'success'
        shell: pwsh
        run: apps/gdupe/scripts/diagnose_crt.ps1

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gdupe-msvc-build-diagnostics
          path: |
            gdupe-msvc-build.log
            gdupe-build-status.txt
            gdupe-crt-diagnostics.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Fail when build failed
        if: steps.build.outcome != 'success'
        shell: pwsh
        run: throw "gdupe MSVC build failed; inspect gdupe-msvc-build-diagnostics."

      - name: Run critical tests
        shell: pwsh
        run: ctest --test-dir build/gdupe -C Release --output-on-failure

      - name: Assemble application package
        shell: pwsh
        run: cmake --install build/gdupe --config Release --prefix "$env:GITHUB_WORKSPACE\dist\gdupe"

      - name: Audit and archive application package
        shell: pwsh
        run: apps/gdupe/scripts/audit_package.ps1

      - name: Upload ready-to-run application
        uses: actions/upload-artifact@v6
        with:
          name: gdupe-windows-x64
          path: dist/gdupe-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Preserve compiled dependency cache
        if: always() && steps.vcpkg-setup.outcome == 'success' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-gdupe-static-all-${{ runner.os }}-${{ hashFiles('apps/gdupe/vcpkg.json', 'apps/gdupe/cmake/triplets/x64-windows-static-crt.cmake') }}
