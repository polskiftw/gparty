name: gdupe-build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/gdupe/**"
      - ".github/workflows/gdupe-build.yml"
  pull_request:
    paths:
      - "apps/gdupe/**"
      - ".github/workflows/gdupe-build.yml"

permissions:
  contents: read

concurrency:
  group: gdupe-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build and validate Windows application
    runs-on: windows-2025
    timeout-minutes: 360
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
      GDUPE_FFMPEG_DIR: ${{ github.workspace }}\third_party\ffmpeg
    steps:
      - uses: actions/checkout@v7

      - name: Restore minimal FFmpeg cache
        id: ffmpeg-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.GDUPE_FFMPEG_DIR }}
          key: gdupe-ffmpeg-minimal-${{ runner.os }}-6bbc22dc09-v4

      - name: Restore compiled dependency cache
        id: vcpkg-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-gdupe-static-crt-${{ runner.os }}-${{ hashFiles('apps/gdupe/vcpkg.json', 'apps/gdupe/triplets/x64-windows-static-crt.cmake') }}

      - name: Install pinned vcpkg
        id: vcpkg-setup
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
          git -C $env:VCPKG_ROOT checkout 4f6d4ae8247b2dcae554555a135e52bb449dd524
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - name: Build source-pinned minimal shared FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $bash = "C:\msys64\usr\bin\bash.exe"
          & $bash -lc 'pacman -S --noconfirm --needed git make diffutils mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-nasm mingw-w64-ucrt-x86_64-zlib mingw-w64-ucrt-x86_64-winpthreads'
          if ($LASTEXITCODE -ne 0) { throw "MSYS2 FFmpeg prerequisites failed" }
          & $bash -lc 'set -euo pipefail; export PATH=/ucrt64/bin:/usr/bin:$PATH; src="$(cygpath -u "$RUNNER_TEMP")/gdupe-ffmpeg-src"; prefix="$(cygpath -u "$GITHUB_WORKSPACE")/third_party/ffmpeg"; staticdeps="$(cygpath -u "$RUNNER_TEMP")/gdupe-ffmpeg-static-deps"; mkdir -p "$staticdeps/lib" "$prefix"; test -f /ucrt64/lib/libz.a; test -f /ucrt64/lib/libwinpthread.a; cp /ucrt64/lib/libz.a "$staticdeps/lib/libz.a"; cp /ucrt64/lib/libwinpthread.a "$staticdeps/lib/libwinpthread.a"; git clone --filter=blob:none https://github.com/FFmpeg/FFmpeg.git "$src"; git -C "$src" checkout --detach 6bbc22dc09c214b2f5334afa30167fa1990eb5df; cd "$src"; ./configure --target-os=mingw32 --prefix="$prefix" --bindir="$prefix" --shlibdir="$prefix" --libdir="$prefix/lib" --incdir="$prefix/include" --disable-static --enable-shared --enable-small --disable-autodetect --disable-everything --disable-network --disable-avdevice --disable-swresample --disable-ffplay --disable-doc --disable-debug --disable-iconv --disable-bzlib --disable-lzma --enable-zlib --disable-pthreads --enable-w32threads --enable-protocol=file --enable-demuxer=gif --enable-demuxer=m4v --enable-demuxer=matroska --enable-demuxer=mov --enable-decoder=av1 --enable-decoder=gif --enable-decoder=h264 --enable-decoder=hevc --enable-decoder=mpeg4 --enable-decoder=vp8 --enable-decoder=vp9 --enable-parser=mpeg4video --enable-encoder=png --enable-muxer=image2 --enable-filter=fps --enable-filter=select --enable-filter=scale --extra-ldflags="-L$staticdeps/lib -static-libgcc" --extra-ldexeflags="-static-libgcc"; make -j"${NUMBER_OF_PROCESSORS:-4}"; make install; cp "$src/COPYING.LGPLv2.1" "$prefix/LICENSE.txt"; cp "$src/LICENSE.md" "$prefix/LICENSE-NOTICE.md"; zlicense="$(find /ucrt64/share/licenses -maxdepth 3 -type f -ipath "*/zlib/*" -print -quit)"; wlicense="$(find /ucrt64/share/licenses -maxdepth 3 -type f \( -ipath "*/winpthreads/*" -o -ipath "*/libwinpthread/*" \) -print -quit)"; test -n "$zlicense"; test -n "$wlicense"; cp "$zlicense" "$prefix/Zlib-LICENSE.txt"; cp "$wlicense" "$prefix/WinPthreads-LICENSE.txt"; printf "FFmpeg source: https://github.com/FFmpeg/FFmpeg\nPinned commit: 6bbc22dc09c214b2f5334afa30167fa1990eb5df\nBuild recipe: .github/workflows/gdupe-build.yml\nStatic helper archives: zlib, WinPthreads\n" > "$prefix/SOURCE.txt"'
          if ($LASTEXITCODE -ne 0) { throw "Minimal FFmpeg build failed" }

      - name: Preserve compiled minimal FFmpeg runtime
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.GDUPE_FFMPEG_DIR }}
          key: gdupe-ffmpeg-minimal-${{ runner.os }}-6bbc22dc09-v4

      - name: Audit minimal FFmpeg runtime
        shell: pwsh
        run: |
          $root = $env:GDUPE_FFMPEG_DIR
          $expectedDlls = @("avcodec-63.dll", "avfilter-12.dll", "avformat-63.dll", "avutil-61.dll", "swscale-10.dll") | Sort-Object
          $actualDlls = @(Get-ChildItem $root -File -Filter "*.dll" | ForEach-Object Name | Sort-Object)
          $dllDiff = @(Compare-Object $expectedDlls $actualDlls)
          if ($dllDiff.Count -ne 0) { throw "FFmpeg DLL surface changed unexpectedly: $($dllDiff | Out-String)" }
          foreach ($file in @("ffmpeg.exe", "ffprobe.exe", "LICENSE.txt", "LICENSE-NOTICE.md", "Zlib-LICENSE.txt", "WinPthreads-LICENSE.txt", "SOURCE.txt")) {
            if (-not (Test-Path -LiteralPath (Join-Path $root $file) -PathType Leaf)) { throw "Minimal FFmpeg runtime is missing $file" }
          }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = (& $vswhere -latest -products * -property installationPath).Trim()
          $dumpbin = Get-ChildItem "$vsInstall\VC\Tools\MSVC" -Recurse -File -Filter dumpbin.exe | Where-Object FullName -Match '\\Hostx64\\x64\\dumpbin\.exe$' | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin.exe was not found" }
          $forbiddenImports = '(?i)\b(?:libwinpthread-1|zlib1|libgcc[^\s]*|libstdc\+\+[^\s]*|avdevice-\d+|swresample-\d+)\.dll\b'
          $badImports = @()
          Get-ChildItem $root -File | Where-Object Extension -In ".exe", ".dll" | Sort-Object Name | ForEach-Object {
            Write-Host "=== $($_.Name) dependencies ==="
            $imports = & $dumpbin.FullName /nologo /dependents $_.FullName
            $imports | Out-Host
            $hits = $imports | Select-String -Pattern $forbiddenImports
            if ($hits) { $badImports += "$($_.Name): $($hits -join ', ')" }
          }
          if ($badImports.Count -ne 0) { throw "FFmpeg runtime imports forbidden helper DLLs:`n$($badImports -join "`n")" }

          $oldPath = $env:PATH
          try {
            $env:PATH = "$root;$env:SystemRoot\System32;$env:SystemRoot"
            & "$root\ffmpeg.exe" -version | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "ffmpeg.exe is not self-contained" }
            & "$root\ffprobe.exe" -version | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "ffprobe.exe is not self-contained" }
          } finally {
            $env:PATH = $oldPath
          }

          $buildconf = (& "$root\ffmpeg.exe" -hide_banner -buildconf 2>&1) -join "`n"
          foreach ($flag in @("--target-os=mingw32", "--disable-static", "--enable-shared", "--disable-autodetect", "--disable-everything", "--disable-network", "--disable-avdevice", "--disable-swresample", "--disable-pthreads", "--enable-w32threads")) {
            if (-not $buildconf.Contains($flag)) { throw "FFmpeg build policy is missing $flag" }
          }
          if ($buildconf -match '--enable-(?:gpl|nonfree|version3)\b') { throw "FFmpeg licensing surface unexpectedly expanded" }
          $expectedCapabilities = @(
            "--enable-protocol=file",
            "--enable-demuxer=gif", "--enable-demuxer=m4v", "--enable-demuxer=matroska", "--enable-demuxer=mov",
            "--enable-decoder=av1", "--enable-decoder=gif", "--enable-decoder=h264", "--enable-decoder=hevc", "--enable-decoder=mpeg4", "--enable-decoder=vp8", "--enable-decoder=vp9",
            "--enable-parser=mpeg4video", "--enable-encoder=png", "--enable-muxer=image2",
            "--enable-filter=fps", "--enable-filter=select", "--enable-filter=scale"
          ) | Sort-Object
          $actualCapabilities = @([regex]::Matches($buildconf, '--enable-(?:protocol|demuxer|decoder|parser|encoder|muxer|filter)=[^\s]+') | ForEach-Object Value | Sort-Object -Unique)
          $capabilityDiff = @(Compare-Object $expectedCapabilities $actualCapabilities)
          if ($capabilityDiff.Count -ne 0) { throw "FFmpeg capability whitelist changed unexpectedly: $($capabilityDiff | Out-String)" }

      - name: Configure
        shell: pwsh
        run: |
          cmake -S apps/gdupe -B build/gdupe -G "Visual Studio 18 2026" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-crt `
            -DVCPKG_OVERLAY_TRIPLETS="$env:GITHUB_WORKSPACE\apps\gdupe\triplets" `
            -DGDUPE_FFMPEG_DIR="$env:GDUPE_FFMPEG_DIR"

      - name: Build
        run: cmake --build build/gdupe --config Release

      - name: Run critical tests
        run: ctest --test-dir build/gdupe -C Release --output-on-failure

      - name: Assemble application
        shell: pwsh
        run: |
          cmake --install build/gdupe --config Release --prefix "$env:GITHUB_WORKSPACE\dist\gdupe"
          Copy-Item apps/gdupe/README.md dist/gdupe/README.md
          $required = @(
            "dist/gdupe/gdupe.exe",
            "dist/gdupe/qt.conf",
            "dist/gdupe/Qt6Core.dll",
            "dist/gdupe/plugins/platforms/qwindows.dll",
            "dist/gdupe/plugins/multimedia/windowsmediaplugin.dll",
            "dist/gdupe/config/gdupe.example.json",
            "dist/gdupe/tools/ffmpeg.exe", "dist/gdupe/tools/ffprobe.exe",
            "dist/gdupe/tools/avcodec-63.dll", "dist/gdupe/tools/avfilter-12.dll", "dist/gdupe/tools/avformat-63.dll", "dist/gdupe/tools/avutil-61.dll", "dist/gdupe/tools/swscale-10.dll",
            "dist/gdupe/tools/FFmpeg-LICENSE.txt", "dist/gdupe/tools/FFmpeg-LICENSE-NOTICE.md", "dist/gdupe/tools/Zlib-LICENSE.txt", "dist/gdupe/tools/WinPthreads-LICENSE.txt", "dist/gdupe/tools/FFmpeg-SOURCE.txt",
            "dist/gdupe/README.md"
          )
          foreach ($path in $required) { if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Portable package is missing $path" } }
          $expectedFfmpegDlls = @("avcodec-63.dll", "avfilter-12.dll", "avformat-63.dll", "avutil-61.dll", "swscale-10.dll") | Sort-Object
          $actualFfmpegDlls = @(Get-ChildItem dist/gdupe/tools -File -Filter "*.dll" | ForEach-Object Name | Sort-Object)
          if (@(Compare-Object $expectedFfmpegDlls $actualFfmpegDlls).Count -ne 0) { throw "Packaged FFmpeg DLL surface changed unexpectedly" }
          if (Test-Path -LiteralPath "dist/gdupe/bin") { throw "Portable package contains an unexpected duplicate bin directory" }
          if (Get-ChildItem dist/gdupe -Recurse -File -Filter "VC_redist*.exe") { throw "Portable package contains an unexpected Visual C++ Redistributable installer" }
          $appLocalCrt = @(Get-ChildItem dist/gdupe -Recurse -File | Where-Object Name -Match '^(concrt|msvcp|vcruntime)\d.*\.dll$')
          if ($appLocalCrt.Count -ne 0) { throw "Portable package contains unexpected MSVC runtime DLLs" }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = (& $vswhere -latest -products * -property installationPath).Trim()
          $dumpbin = Get-ChildItem "$vsInstall\VC\Tools\MSVC" -Recurse -File -Filter dumpbin.exe | Where-Object FullName -Match '\\Hostx64\\x64\\dumpbin\.exe$' | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin.exe was not found" }
          $runtimeImports = @()
          Get-ChildItem dist/gdupe -Recurse -File | Where-Object Extension -In ".exe", ".dll" | ForEach-Object {
            $imports = & $dumpbin.FullName /nologo /dependents $_.FullName | Select-String -Pattern '(?i)\b(?:concrt|msvcp|vcruntime)\d[^\s]*\.dll\b'
            if ($imports) { $runtimeImports += "$($_.FullName): $($imports -join ', ')" }
          }
          if ($runtimeImports.Count -ne 0) { throw "Portable package still imports the dynamic MSVC runtime:`n$($runtimeImports -join "`n")" }
          Compress-Archive -Path dist/gdupe/* -DestinationPath dist/gdupe-windows-x64.zip

      - name: Upload ready-to-run application
        uses: actions/upload-artifact@v6
        with:
          name: gdupe-windows-x64
          path: dist/gdupe-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Preserve compiled dependency cache
        if: always() && steps.vcpkg-setup.outcome == 'success' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-gdupe-static-crt-${{ runner.os }}-${{ hashFiles('apps/gdupe/vcpkg.json', 'apps/gdupe/triplets/x64-windows-static-crt.cmake') }}
