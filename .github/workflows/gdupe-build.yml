name: gdupe-build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/gdupe/**"
      - ".github/workflows/gdupe-build.yml"
  pull_request:
    paths:
      - "apps/gdupe/**"
      - ".github/workflows/gdupe-build.yml"

permissions:
  contents: read

concurrency:
  group: gdupe-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build and validate native NVIDIA Windows application
    runs-on: windows-2025
    timeout-minutes: 360
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
    steps:
      - uses: actions/checkout@v7

      - name: Restore compiled dependency cache
        id: vcpkg-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-gdupe-nvdec-v1-${{ runner.os }}-${{ hashFiles('apps/gdupe/vcpkg.json', 'apps/gdupe/cmake/triplets/x64-windows-static-crt.cmake') }}

      - name: Install pinned vcpkg
        id: vcpkg-setup
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
          git -C $env:VCPKG_ROOT checkout 4f6d4ae8247b2dcae554555a135e52bb449dd524
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - name: Configure
        shell: pwsh
        run: |
          cmake -S apps/gdupe -B build/gdupe -G "Visual Studio 18 2026" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-crt `
            -DVCPKG_OVERLAY_TRIPLETS="$env:GITHUB_WORKSPACE\apps\gdupe\cmake\triplets"

      - name: Audit native Windows dependency surface
        shell: pwsh
        run: apps/gdupe/scripts/audit_dependencies.ps1

      - name: Build and capture diagnostics
        id: build
        continue-on-error: true
        shell: pwsh
        run: |
          $log = Join-Path $env:GITHUB_WORKSPACE "gdupe-msvc-build.log"
          cmake --build build/gdupe --config Release 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          "exit_code=$code" | Set-Content -Encoding ascii gdupe-build-status.txt
          if ($code -ne 0) { exit $code }

      - name: Diagnose Release CRT provenance
        if: steps.build.outcome == 'success'
        shell: pwsh
        run: apps/gdupe/scripts/diagnose_crt.ps1

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gdupe-msvc-build-diagnostics
          path: |
            gdupe-msvc-build.log
            gdupe-build-status.txt
            gdupe-crt-diagnostics.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Fail when build failed
        if: steps.build.outcome != 'success'
        shell: pwsh
        run: throw "gdupe MSVC build failed; inspect gdupe-msvc-build-diagnostics."

      - name: Run critical tests
        id: tests
        continue-on-error: true
        shell: pwsh
        run: |
          ctest --test-dir build/gdupe -C Release --output-on-failure --output-log gdupe-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload test diagnostics
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: gdupe-test-diagnostics
          path: gdupe-test.log
          if-no-files-found: warn
          retention-days: 7

      - name: Fail when critical tests failed
        if: steps.tests.outcome != 'success'
        shell: pwsh
        run: throw "gdupe critical tests failed; inspect gdupe-test-diagnostics."

      - name: Assemble GIF compatibility sweep bundle
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "dist\gdupe-gif-sweep"
          New-Item -ItemType Directory -Force $root | Out-Null
          New-Item -ItemType Directory -Force (Join-Path $root "config") | Out-Null
          Copy-Item -LiteralPath "$env:GITHUB_WORKSPACE\build\gdupe\Release\gdupe-gif-sweep.exe" -Destination $root
          Copy-Item -LiteralPath "$env:GITHUB_WORKSPACE\apps\gdupe\config\gdupe.example.json" -Destination (Join-Path $root "config")
          @'
          @echo off
          gdupe-gif-sweep.exe
          echo.
          echo Report: gdupe-gif-sweep-report.jsonl
          pause
          '@ | Set-Content -Encoding ascii (Join-Path $root "run-gif-sweep.cmd")

      - name: Upload GIF compatibility sweep
        uses: actions/upload-artifact@v6
        with:
          name: gdupe-gif-sweep-windows-x64
          path: dist/gdupe-gif-sweep/**
          if-no-files-found: error
          retention-days: 30

      - name: Assemble NVIDIA hardware self-test bundle
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "dist\gdupe-nvdec-selftest"
          New-Item -ItemType Directory -Force $root | Out-Null
          New-Item -ItemType Directory -Force (Join-Path $root "fixtures") | Out-Null
          foreach ($name in @(
            "gdupe_tests.exe",
            "gdupe_static_media_tests.exe",
            "gdupe_main10_tests.exe",
            "gdupe_nvdec_webm_tests.exe",
            "gdupe_preview_tests.exe",
            "gdupe_preview_lifecycle_tests.exe"
          )) {
            Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "build\gdupe\Release\$name") -Destination $root
          }
          Copy-Item -Path "$env:GITHUB_WORKSPACE\apps\gdupe\tests\fixtures\*" -Destination (Join-Path $root "fixtures")
          Copy-Item -LiteralPath "$env:GITHUB_WORKSPACE\apps\gdupe\tests\run_nvdec_tests.ps1" -Destination $root

      - name: Upload NVIDIA hardware self-test
        uses: actions/upload-artifact@v6
        with:
          name: gdupe-nvdec-selftest-windows-x64
          path: dist/gdupe-nvdec-selftest/**
          if-no-files-found: error
          retention-days: 30

      - name: Assemble application package
        shell: pwsh
        run: cmake --install build/gdupe --config Release --prefix "$env:GITHUB_WORKSPACE\dist\gdupe"

      - name: Audit application package
        shell: pwsh
        run: apps/gdupe/scripts/audit_package.ps1

      - name: Upload ready-to-run application
        uses: actions/upload-artifact@v6
        with:
          name: gdupe-windows-x64
          path: dist/gdupe/**
          if-no-files-found: error
          retention-days: 30

      - name: Preserve compiled dependency cache
        if: always() && steps.vcpkg-setup.outcome == 'success' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-gdupe-nvdec-v1-${{ runner.os }}-${{ hashFiles('apps/gdupe/vcpkg.json', 'apps/gdupe/cmake/triplets/x64-windows-static-crt.cmake') }}
