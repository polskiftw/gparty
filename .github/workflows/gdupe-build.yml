name: gdupe-build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/gdupe/**"
      - ".github/workflows/gdupe-build.yml"
  pull_request:
    paths:
      - "apps/gdupe/**"
      - ".github/workflows/gdupe-build.yml"

permissions:
  contents: read

concurrency:
  group: gdupe-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build and validate Windows application
    runs-on: windows-2025
    timeout-minutes: 360
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
    steps:
      - uses: actions/checkout@v7

      - name: Restore compiled dependency cache
        id: vcpkg-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-gdupe-${{ runner.os }}-${{ hashFiles('apps/gdupe/vcpkg.json') }}

      - name: Install pinned vcpkg
        id: vcpkg-setup
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
          git -C $env:VCPKG_ROOT checkout 4f6d4ae8247b2dcae554555a135e52bb449dd524
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - name: Fetch pinned prebuilt FFmpeg tools
        shell: pwsh
        run: |
          $tag = "autobuild-2026-08-10-13-17"
          $asset = "ffmpeg-N-126039-g6bbc22dc09-win64-lgpl-shared.zip"
          $expected = "7c32fccf82c7b744ed7a2c577051ca783d5ce47c0bd00e7eeeee8d9e7050d057"
          $archive = Join-Path $env:RUNNER_TEMP $asset
          $unpack = Join-Path $env:RUNNER_TEMP "gdupe-ffmpeg"
          curl.exe -L --fail --retry 3 --output $archive `
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/$tag/$asset"
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Pinned FFmpeg archive checksum mismatch" }
          Expand-Archive -Path $archive -DestinationPath $unpack
          $root = Get-ChildItem -Path $unpack -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force third_party/ffmpeg | Out-Null
          Copy-Item "$($root.FullName)\bin\ffmpeg.exe" third_party/ffmpeg/ffmpeg.exe
          Copy-Item "$($root.FullName)\bin\ffprobe.exe" third_party/ffmpeg/ffprobe.exe
          Copy-Item "$($root.FullName)\bin\*.dll" third_party/ffmpeg/
          Copy-Item "$($root.FullName)\LICENSE.txt" third_party/ffmpeg/LICENSE.txt

      - name: Configure
        shell: pwsh
        run: |
          cmake -S apps/gdupe -B build/gdupe -G "Visual Studio 18 2026" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DGDUPE_FFMPEG_DIR="$env:GITHUB_WORKSPACE\third_party\ffmpeg"

      - name: Build
        run: cmake --build build/gdupe --config Release

      - name: Run critical tests
        run: ctest --test-dir build/gdupe -C Release --output-on-failure

      - name: Assemble application
        shell: pwsh
        run: |
          cmake --install build/gdupe --config Release `
            --prefix "$env:GITHUB_WORKSPACE\dist\gdupe"
          Copy-Item apps/gdupe/README.md dist/gdupe/README.md
          $required = @(
            "dist/gdupe/gdupe.exe",
            "dist/gdupe/qt.conf",
            "dist/gdupe/Qt6Core.dll",
            "dist/gdupe/Qt6/plugins/platforms/qwindows.dll",
            "dist/gdupe/Qt6/plugins/multimedia/windowsmediaplugin.dll",
            "dist/gdupe/config/gdupe.example.json",
            "dist/gdupe/tools/ffmpeg.exe",
            "dist/gdupe/tools/ffprobe.exe",
            "dist/gdupe/tools/FFmpeg-LICENSE.txt",
            "dist/gdupe/README.md"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Portable package is missing $path"
            }
          }
          if (Test-Path -LiteralPath "dist/gdupe/bin") {
            throw "Portable package contains an unexpected duplicate bin directory"
          }
          Compress-Archive -Path dist/gdupe/* -DestinationPath dist/gdupe-windows-x64.zip

      - name: Upload ready-to-run application
        uses: actions/upload-artifact@v6
        with:
          name: gdupe-windows-x64
          path: dist/gdupe-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Preserve compiled dependency cache
        if: always() && steps.vcpkg-setup.outcome == 'success' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-gdupe-${{ runner.os }}-${{ hashFiles('apps/gdupe/vcpkg.json') }}
