name: gdupe-build

on:
  workflow_dispatch:
  push:
    branches: [main, gdupe-static-media]
    paths:
      - "apps/gdupe/**"
      - ".github/workflows/gdupe-build.yml"
  pull_request:
    paths:
      - "apps/gdupe/**"
      - ".github/workflows/gdupe-build.yml"

permissions:
  contents: read

concurrency:
  group: gdupe-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build and validate Windows application
    runs-on: windows-2025
    timeout-minutes: 360
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
      GDUPE_FFMPEG_DIR: ${{ github.workspace }}\third_party\ffmpeg
      GDUPE_LIBAVC_DIR: ${{ github.workspace }}\third_party\libavc
      GDUPE_LIBHEVC_DIR: ${{ github.workspace }}\third_party\libhevc
      FFMPEG_SOURCE_COMMIT: 6bbc22dc09c214b2f5334afa30167fa1990eb5df
    steps:
      - uses: actions/checkout@v7

      - name: Restore minimal FFmpeg SDK cache
        id: ffmpeg-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.GDUPE_FFMPEG_DIR }}
          key: gdupe-ffmpeg-direct-msvc-mt-${{ runner.os }}-6bbc22dc09-v1

      - name: Restore static libavc SDK cache
        id: libavc-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.GDUPE_LIBAVC_DIR }}
          key: gdupe-libavc-msvc-mt-${{ runner.os }}-e67b0aa3b0-v1

      - name: Restore static libhevc SDK cache
        id: libhevc-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.GDUPE_LIBHEVC_DIR }}
          key: gdupe-libhevc-msvc-mt-${{ runner.os }}-1476a94a5e-v1

      - name: Restore compiled dependency cache
        id: vcpkg-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-gdupe-static-all-${{ runner.os }}-${{ hashFiles('apps/gdupe/vcpkg.json', 'apps/gdupe/triplets/x64-windows-static-crt.cmake') }}

      - name: Install pinned vcpkg
        id: vcpkg-setup
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
          git -C $env:VCPKG_ROOT checkout 4f6d4ae8247b2dcae554555a135e52bb449dd524
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - name: Build source-pinned static AOSP libavc with MSVC
        if: steps.libavc-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: apps/gdupe/scripts/build_libavc.ps1

      - name: Preserve static libavc SDK
        if: steps.libavc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.GDUPE_LIBAVC_DIR }}
          key: gdupe-libavc-msvc-mt-${{ runner.os }}-e67b0aa3b0-v1

      - name: Build source-pinned static AOSP libhevc with MSVC
        if: steps.libhevc-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: apps/gdupe/scripts/build_libhevc.ps1

      - name: Preserve static libhevc SDK
        if: steps.libhevc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.GDUPE_LIBHEVC_DIR }}
          key: gdupe-libhevc-msvc-mt-${{ runner.os }}-1476a94a5e-v1

      # Temporary transition path. These steps disappear once media_decode has
      # replaced all FFmpeg call sites; final gdupe ships no FFmpeg DLLs.
      - name: Build source-pinned minimal LGPL FFmpeg DLLs with MSVC
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: apps/gdupe/scripts/build_ffmpeg.ps1

      - name: Preserve minimal FFmpeg SDK
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.GDUPE_FFMPEG_DIR }}
          key: gdupe-ffmpeg-direct-msvc-mt-${{ runner.os }}-6bbc22dc09-v1

      - name: Audit exact FFmpeg surface
        shell: pwsh
        run: apps/gdupe/scripts/audit_ffmpeg.ps1

      - name: Configure
        shell: pwsh
        run: |
          cmake -S apps/gdupe -B build/gdupe -G "Visual Studio 18 2026" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-crt `
            -DVCPKG_OVERLAY_TRIPLETS="$env:GITHUB_WORKSPACE\apps\gdupe\triplets" `
            -DGDUPE_FFMPEG_DIR="$env:GDUPE_FFMPEG_DIR"

      - name: Audit exact static dependency and FLTK feature surface
        shell: pwsh
        run: apps/gdupe/scripts/audit_dependencies.ps1

      - name: Build
        run: cmake --build build/gdupe --config Release

      - name: Run critical tests against minimal FFmpeg DLLs
        shell: pwsh
        run: |
          $env:PATH = "$env:GDUPE_FFMPEG_DIR;$env:PATH"
          ctest --test-dir build/gdupe -C Release --output-on-failure

      - name: Assemble portable application
        shell: pwsh
        run: |
          cmake --install build/gdupe --config Release --prefix "$env:GITHUB_WORKSPACE\dist\gdupe"
          Copy-Item apps/gdupe/README.md dist/gdupe/README.md

      - name: Audit and archive portable application
        shell: pwsh
        run: apps/gdupe/scripts/audit_package.ps1

      - name: Upload ready-to-run application
        uses: actions/upload-artifact@v6
        with:
          name: gdupe-windows-x64
          path: dist/gdupe-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Preserve compiled dependency cache
        if: always() && steps.vcpkg-setup.outcome == 'success' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-gdupe-static-all-${{ runner.os }}-${{ hashFiles('apps/gdupe/vcpkg.json', 'apps/gdupe/triplets/x64-windows-static-crt.cmake') }}
