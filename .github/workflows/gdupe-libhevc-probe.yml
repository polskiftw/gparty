name: gdupe-libhevc-probe

on:
  workflow_dispatch:
  push:
    branches: [gdupe-libhevc-probe]
    paths:
      - ".github/workflows/gdupe-libhevc-probe.yml"
      - "apps/gdupe/experiments/libhevc/**"

permissions:
  contents: read

concurrency:
  group: gdupe-libhevc-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-msvc:
    name: Probe AOSP libhevc decoder on Windows MSVC /MT
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      LIBHEVC_COMMIT: 1476a94a5ecbaed7a0aa37a7b26f1ee6d22a3dac
    steps:
      - uses: actions/checkout@v7

      - name: Clone pinned AOSP libhevc
        shell: pwsh
        run: |
          git clone --filter=blob:none https://android.googlesource.com/platform/external/libhevc third_party/libhevc
          git -C third_party/libhevc checkout $env:LIBHEVC_COMMIT
          git -C third_party/libhevc rev-parse HEAD

      - name: Preserve decoder portability sources
        uses: actions/upload-artifact@v6
        with:
          name: gdupe-libhevc-portability-snapshot
          path: |
            third_party/libhevc/CMakeLists.txt
            third_party/libhevc/common/**
            third_party/libhevc/decoder/ihevcd_cxa_api.*
            third_party/libhevc/decoder/ihevcd_structs.h
            third_party/libhevc/test/decoder/**
          if-no-files-found: error
          retention-days: 7

      - name: Configure upstream CMake with static MSVC runtime
        shell: pwsh
        run: |
          cmake -S third_party/libhevc -B build/libhevc -G "Visual Studio 18 2026" -A x64 `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW

      - name: Build decoder target and capture diagnostics
        id: build
        continue-on-error: true
        shell: pwsh
        run: |
          $log = Join-Path $env:GITHUB_WORKSPACE "libhevc-msvc-build.log"
          cmake --build build/libhevc --config Release --target libhevcdec --parallel 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          "exit_code=$code" | Set-Content -Encoding ascii libhevc-build-status.txt
          if ($code -ne 0) { exit $code }

      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gdupe-libhevc-msvc-diagnostics
          path: |
            libhevc-msvc-build.log
            libhevc-build-status.txt
          if-no-files-found: error
          retention-days: 7

      - name: Inventory decoder artifacts
        if: steps.build.outcome == 'success'
        shell: pwsh
        run: |
          Get-ChildItem build/libhevc -Recurse -File -Include *.lib,*.dll | `
            Sort-Object FullName | ForEach-Object { $_.FullName }
          $dlls = @(Get-ChildItem build/libhevc -Recurse -File -Filter *.dll)
          if ($dlls.Count -ne 0) { throw "Probe produced DLLs; static-only requirement is not met." }
          $libs = @(Get-ChildItem build/libhevc -Recurse -File -Filter *hevcdec*.lib)
          if ($libs.Count -eq 0) { throw "Probe produced no decoder static .lib." }

      - name: Verify /MT directives
        if: steps.build.outcome == 'success'
        shell: pwsh
        run: |
          $libs = @(Get-ChildItem build/libhevc -Recurse -File -Filter *hevcdec*.lib)
          foreach ($lib in $libs) {
            $directives = (& dumpbin /directives $lib.FullName 2>&1 | Out-String)
            Write-Host $directives
            if ($directives -match 'MSVCRT') { throw "Dynamic MSVC CRT directive found in $($lib.FullName)" }
          }

      - name: Write static-library proof
        if: steps.build.outcome == 'success'
        shell: pwsh
        run: |
          $lib = Get-ChildItem build/libhevc -Recurse -File -Filter *hevcdec*.lib | Select-Object -First 1
          @"
          AOSP libhevc decoder static-library probe passed.
          source_commit=$env:LIBHEVC_COMMIT
          generator=Visual Studio 18 2026 x64
          runtime=/MT
          decoder_library=$($lib.Name)
          "@ | Set-Content -Encoding ascii libhevc-static-proof.txt

      - name: Upload static-library proof
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: gdupe-libhevc-static-proof
          path: libhevc-static-proof.txt
          if-no-files-found: error
          retention-days: 7

      - name: Fail probe when decoder build failed
        if: steps.build.outcome != 'success'
        shell: pwsh
        run: throw "AOSP libhevc decoder target did not build under MSVC; inspect diagnostics and portability snapshot artifacts."
