name: gdupe-libhevc-probe

on:
  workflow_dispatch:
  push:
    branches: [gdupe-libhevc-probe]
    paths:
      - ".github/workflows/gdupe-libhevc-probe.yml"
      - "apps/gdupe/experiments/libhevc/**"

permissions:
  contents: read

concurrency:
  group: gdupe-libhevc-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-msvc:
    name: Probe AOSP libhevc decoder on Windows MSVC /MT
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      LIBHEVC_COMMIT: 1476a94a5ecbaed7a0aa37a7b26f1ee6d22a3dac
    steps:
      - uses: actions/checkout@v7

      - name: Clone pinned AOSP libhevc
        shell: pwsh
        run: |
          git clone --filter=blob:none https://android.googlesource.com/platform/external/libhevc third_party/libhevc
          git -C third_party/libhevc checkout $env:LIBHEVC_COMMIT
          git -C third_party/libhevc rev-parse HEAD

      - name: Apply Windows MSVC compatibility layer
        shell: pwsh
        run: |
          Copy-Item apps/gdupe/experiments/libhevc/ithread_windows.c third_party/libhevc/common/ithread.c -Force
          Copy-Item apps/gdupe/experiments/libhevc/ihevc_platform_macros_msvc.h third_party/libhevc/common/x86/ihevc_platform_macros.h -Force
          $utilsPath = "third_party/libhevc/cmake/utils.cmake"
          $utils = Get-Content $utilsPath -Raw
          $utils = $utils -replace 'link_libraries\(Threads::Threads m\)', 'link_libraries(Threads::Threads)'
          Set-Content -Path $utilsPath -Value $utils -Encoding utf8
          if ((Get-Content $utilsPath -Raw) -match 'link_libraries\(Threads::Threads m\)') { throw "Failed to remove Unix libm link" }

      - name: Configure upstream CMake for MSVC x64 static CRT
        shell: pwsh
        run: |
          cmake -S third_party/libhevc -B build/libhevc -G "Visual Studio 18 2026" -A x64 `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW `
            -DCMAKE_C_FLAGS="/DX86_MSVC /DWINDOWS_TIMER"

      - name: Build static decoder library
        shell: pwsh
        run: cmake --build build/libhevc --config Release --target libhevcdec --parallel

      - name: Verify static-only output and /MT directives
        shell: pwsh
        run: |
          $lib = Get-Item build/libhevc/Release/libhevcdec.lib
          if (-not $lib) { throw "libhevcdec.lib missing" }
          $dlls = @(Get-ChildItem build/libhevc -Recurse -File -Filter *.dll)
          if ($dlls.Count -ne 0) { throw "Unexpected DLL output from libhevc build" }

          $dumpbin = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio\18\Enterprise\VC\Tools\MSVC" -Recurse -File -Filter dumpbin.exe |
            Where-Object { $_.FullName -match 'Hostx64\\x64\\dumpbin\.exe$' } |
            Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin.exe not found" }

          $directives = (& $dumpbin.FullName /directives $lib.FullName 2>&1 | Out-String)
          $directives | Set-Content -Encoding utf8 libhevc-directives.txt
          if ($directives -notmatch '(?i)LIBCMT') { throw "Static CRT LIBCMT directive not found" }
          if ($directives -match '(?i)MSVCRT') { throw "Dynamic CRT MSVCRT directive found" }
          Write-Host "libhevcdec.lib is static and requests LIBCMT (/MT)."

      - name: Build upstream decoder test executable
        shell: pwsh
        run: cmake --build build/libhevc --config Release --target hevcdec --parallel

      - name: Verify decoder executable has no VC runtime DLL dependency
        shell: pwsh
        run: |
          $exe = Get-Item build/libhevc/Release/hevcdec.exe
          $dumpbin = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio\18\Enterprise\VC\Tools\MSVC" -Recurse -File -Filter dumpbin.exe |
            Where-Object { $_.FullName -match 'Hostx64\\x64\\dumpbin\.exe$' } |
            Select-Object -First 1
          $deps = (& $dumpbin.FullName /dependents $exe.FullName 2>&1 | Out-String)
          $deps | Set-Content -Encoding utf8 hevcdec-dependents.txt
          if ($deps -match '(?i)(vcruntime|msvcp|msvcr|ucrtbase)\.dll') { throw "Dynamic VC/Universal CRT dependency found" }
          Write-Host $deps

      - name: Download real HEVC conformance bitstream
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://fate-suite.ffmpeg.org/hevc-conformance/MERGE_A_TI_3.bit" -OutFile hevc-probe.bit
          $sample = Get-Item hevc-probe.bit
          if ($sample.Length -lt 1000) { throw "Downloaded HEVC sample looks invalid" }
          Write-Host "HEVC sample bytes: $($sample.Length)"

      - name: Decode one real HEVC frame
        shell: pwsh
        run: |
          $exe = (Resolve-Path build/libhevc/Release/hevcdec.exe).Path
          $input = (Resolve-Path hevc-probe.bit).Path
          $output = Join-Path $env:GITHUB_WORKSPACE "hevc-probe.yuv"
          & $exe --input $input --output $output --save_output 1 --num_frames 1 --num_cores 1 --chroma_format YUV_420P --arch X86_SSE42
          if ($LASTEXITCODE -ne 0) { throw "hevcdec failed with exit code $LASTEXITCODE" }
          $decoded = Get-Item $output -ErrorAction Stop
          if ($decoded.Length -le 0) { throw "Decoder produced empty output" }
          Write-Host "Decoded frame bytes: $($decoded.Length)"

      - name: Write proof summary
        shell: pwsh
        run: |
          @"
          AOSP libhevc Windows/MSVC probe PASSED.
          source_commit=$env:LIBHEVC_COMMIT
          compiler=MSVC x64 (Visual Studio 18 2026)
          runtime=/MT (LIBCMT)
          decoder_library=libhevcdec.lib
          decoder_dlls=0
          hevcdec_dynamic_vc_runtime=0
          real_hevc_decode=passed
          "@ | Set-Content -Encoding ascii libhevc-windows-proof.txt

      - name: Upload proof artifacts
        uses: actions/upload-artifact@v6
        with:
          name: gdupe-libhevc-windows-proof
          path: |
            libhevc-windows-proof.txt
            libhevc-directives.txt
            hevcdec-dependents.txt
            hevc-probe.yuv
          if-no-files-found: error
          retention-days: 7
