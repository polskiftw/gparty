name: audit ghost workflows

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  audit:
    name: Preview runs for workflows whose files no longer exist
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: List historical runs that would be deleted
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["REPOSITORY"]
          branch = os.environ["DEFAULT_BRANCH"]
          token = os.environ["GH_TOKEN"]
          api = "https://api.github.com"

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "gparty-ghost-workflow-auditor",
          }

          def request(path, *, expected=(200,), attempts=5):
              url = api + path
              for attempt in range(1, attempts + 1):
                  req = urllib.request.Request(url, method="GET", headers=headers)
                  try:
                      with urllib.request.urlopen(req, timeout=60) as response:
                          status = response.status
                          body = response.read()
                  except urllib.error.HTTPError as exc:
                      status = exc.code
                      body = exc.read()
                  except Exception:
                      if attempt == attempts:
                          raise
                      time.sleep(min(8, 2 ** (attempt - 1)))
                      continue

                  if status in expected:
                      if not body:
                          return None, status
                      return json.loads(body), status

                  if status in {408, 429, 500, 502, 503, 504} and attempt < attempts:
                      time.sleep(min(8, 2 ** (attempt - 1)))
                      continue

                  detail = body.decode("utf-8", errors="replace")[:1000]
                  raise RuntimeError(f"GET {path} failed HTTP {status}: {detail}")

              raise RuntimeError(f"GET {path} exhausted retries")

          workflows = []
          page = 1
          while True:
              payload, _ = request(
                  f"/repos/{repo}/actions/workflows?per_page=100&page={page}",
              )
              batch = payload.get("workflows", [])
              workflows.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          ghosts = []
          live = []
          for workflow in workflows:
              path = str(workflow.get("path") or "")
              if not path.startswith(".github/workflows/"):
                  live.append(workflow)
                  continue

              encoded_path = urllib.parse.quote(path, safe="/")
              encoded_branch = urllib.parse.quote(branch, safe="")
              _, status = request(
                  f"/repos/{repo}/contents/{encoded_path}?ref={encoded_branch}",
                  expected=(200, 404),
              )
              if status == 404:
                  ghosts.append(workflow)
              else:
                  live.append(workflow)

          print(f"Registered workflows: {len(workflows)}")
          print(f"Live workflow files: {len(live)}")
          print(f"Ghost workflow registrations: {len(ghosts)}")

          total_runs = 0
          ghost_results = []

          for workflow in ghosts:
              workflow_id = int(workflow["id"])
              name = str(workflow.get("name") or workflow_id)
              path = str(workflow.get("path") or "")
              runs_for_workflow = []
              page = 1

              while True:
                  payload, _ = request(
                      f"/repos/{repo}/actions/workflows/{workflow_id}/runs?per_page=100&page={page}",
                  )
                  runs = payload.get("workflow_runs", [])
                  runs_for_workflow.extend(runs)
                  if len(runs) < 100:
                      break
                  page += 1

              print(f"\nGHOST: {name} ({path}, id={workflow_id})")
              if not runs_for_workflow:
                  print("  no historical runs")
              for run in runs_for_workflow:
                  run_id = int(run["id"])
                  status = run.get("status")
                  conclusion = run.get("conclusion")
                  event = run.get("event")
                  created_at = run.get("created_at")
                  print(
                      f"  WOULD DELETE run {run_id} "
                      f"(event={event}, status={status}, conclusion={conclusion}, created_at={created_at})"
                  )

              count = len(runs_for_workflow)
              total_runs += count
              ghost_results.append((name, path, workflow_id, count, runs_for_workflow))

          print("\nDRY RUN COMPLETE — NOTHING WAS DELETED")
          print(f"Ghost workflows found: {len(ghosts)}")
          print(f"Historical runs that would be deleted: {total_runs}")

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as summary:
                  summary.write("## Ghost workflow cleanup — DRY RUN ONLY\n\n")
                  summary.write("**Nothing was deleted.**\n\n")
                  summary.write(f"- Registered workflows inspected: **{len(workflows)}**\n")
                  summary.write(f"- Live workflow files preserved: **{len(live)}**\n")
                  summary.write(f"- Ghost workflow registrations found: **{len(ghosts)}**\n")
                  summary.write(f"- Historical runs that would be deleted: **{total_runs}**\n\n")

                  if ghost_results:
                      summary.write("### Proposed deletions\n\n")
                      for name, path, workflow_id, count, runs in ghost_results:
                          summary.write(
                              f"#### `{name}`\n\n"
                              f"- Path: `{path}`\n"
                              f"- Workflow ID: `{workflow_id}`\n"
                              f"- Historical runs: **{count}**\n"
                          )
                          for run in runs:
                              summary.write(
                                  f"  - Run `{run['id']}` — event `{run.get('event')}` — "
                                  f"status `{run.get('status')}` — conclusion `{run.get('conclusion')}` — "
                                  f"created `{run.get('created_at')}`\n"
                              )
                          summary.write("\n")
                  else:
                      summary.write("No ghost workflow registrations were found.\n")
          PY
